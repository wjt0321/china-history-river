<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 朱砂印底 -->
  <rect x="6" y="6" width="52" height="52" rx="6" fill="#8b3535"/>
  <!-- 内描白边（印章磨损感） -->
  <rect x="9" y="9" width="46" height="46" rx="4" fill="none" stroke="#f5f0e6" stroke-width="1.5" stroke-opacity="0.85"/>
  <!-- 篆体"史"字简化形态 -->
  <g fill="#f5f0e6" font-family="'Noto Serif SC', 'Songti SC', serif" font-weight="700" text-anchor="middle">
    <text x="32" y="44" font-size="36">史</text>
  </g>
</svg>
